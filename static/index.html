<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  :root { --accent: #2563eb; --bg: #f3f4f6; --card: #fff; --border: #e5e7eb; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: #111827; }
  header { background: var(--accent); color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; display: grid; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  form .full { grid-column: 1 / -1; }
  input, select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; width: 100%; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  button:hover { filter: brightness(.92); }
  button.secondary { background: #6b7280; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: #6b7280; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .summary div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .empty { color: #6b7280; font-size: 14px; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 16px; }
  .msg.ok { color: #16a34a; }
  .msg.err { color: #dc2626; }
</style>
</head>
<body>
<header>
  <h1>Money Tracker — учёт личных расходов</h1>
  <p id="appInfo">Загрузка…</p>
</header>
<main>
  <section class="card">
    <h2>Добавить трату</h2>
    <form id="addForm">
      <input id="description" placeholder="Описание (например, Кофе)" required>
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="Сумма" required>
      <input id="category" placeholder="Категория (например, Еда)" required>
      <input id="spent_on" type="date">
      <div class="full"><button type="submit">Добавить</button></div>
    </form>
    <div id="addMsg" class="msg"></div>
  </section>

  <section class="card">
    <h2>Мои траты</h2>
    <div class="actions">
      <input id="filter" placeholder="Фильтр по категории" style="max-width:240px">
      <button type="button" onclick="loadExpenses()">Обновить</button>
      <button type="button" class="secondary" onclick="document.getElementById('filter').value=''; loadExpenses()">Сбросить</button>
    </div>
    <table>
      <thead><tr><th>Дата</th><th>Описание</th><th>Категория</th><th class="num">Сумма</th><th></th></tr></thead>
      <tbody id="expenseRows"></tbody>
    </table>
    <p id="emptyMsg" class="empty" hidden>Трат пока нет — добавьте первую выше.</p>
  </section>

  <section class="card">
    <h2>Статистика по категориям</h2>
    <div class="summary" id="summary"></div>
  </section>
</main>

<script>
const API = "";

async function loadInfo() {
  try {
    const r = await fetch(API + "/version");
    const d = await r.json();
    document.getElementById("appInfo").textContent = d.app + " v" + d.version;
  } catch { document.getElementById("appInfo").textContent = "Сервер недоступен"; }
}

async function loadExpenses() {
  const cat = document.getElementById("filter").value.trim();
  const url = API + "/expenses" + (cat ? "?category=" + encodeURIComponent(cat) : "");
  const r = await fetch(url);
  const items = await r.json();
  const tbody = document.getElementById("expenseRows");
  tbody.innerHTML = "";
  document.getElementById("emptyMsg").hidden = items.length > 0;
  for (const e of items) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + e.spent_on + "</td>" +
      "<td>" + e.description + "</td>" +
      "<td>" + e.category + "</td>" +
      '<td class="num">' + e.amount.toFixed(2) + " " + e.currency + "</td>" +
      '<td class="num"><button class="secondary" data-id="' + e.id + '">Удалить</button></td>';
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll("button[data-id]").forEach(b =>
    b.onclick = () => deleteExpense(b.dataset.id));
  loadSummary();
}

async function loadSummary() {
  const r = await fetch(API + "/expenses/summary/by-category");
  const d = await r.json();
  const box = document.getElementById("summary");
  const cats = Object.entries(d.categories);
  if (!cats.length) { box.innerHTML = '<span class="empty">Нет данных</span>'; return; }
  box.innerHTML = cats.map(([c, v]) =>
    "<div><span>" + c + " (" + v.count + ")</span><span>" + v.total.toFixed(2) + " " + d.currency + "</span></div>"
  ).join("");
}

async function deleteExpense(id) {
  await fetch(API + "/expenses/" + id, { method: "DELETE" });
  loadExpenses();
}

document.getElementById("addForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById("addMsg");
  const payload = {
    description: document.getElementById("description").value,
    amount: parseFloat(document.getElementById("amount").value),
    category: document.getElementById("category").value,
    spent_on: document.getElementById("spent_on").value || null,
  };
  const r = await fetch(API + "/expenses", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (r.ok) {
    msg.textContent = "Трата добавлена";
    msg.className = "msg ok";
    ev.target.reset();
    loadExpenses();
  } else {
    const err = await r.json();
    msg.textContent = "Ошибка: " + (err.detail || r.status);
    msg.className = "msg err";
  }
};

loadInfo();
loadExpenses();
</script>
</body>
</html>
